# Nginx para el sitio de Next exportado como estático (`output: "export"`),
# servido en la raíz del dominio.
#
# OJO con `add_header`: NO se hereda. En cuanto un `location` declara su
# propio `add_header`, pierde TODOS los del bloque `server`. Por eso las
# cabeceras de seguridad se repiten en cada location que añade las suyas.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- cabeceras de seguridad ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No hay Content-Security-Policy a propósito: index.html carga Google
    # Fonts y el kit de Font Awesome desde CDN, así que una CSP estricta
    # rompería la tipografía y los iconos. Si algún día quitas esos CDN,
    # este es el sitio donde añadirla.

    # ---------- assets con hash en el nombre ----------
    # Next escribe sus bundles en /_next/static/ (antes Vite los ponía en
    # /assets/). El nombre lleva hash y cambia en cada build, así que se
    # pueden cachear para siempre sin miedo a servir una versión vieja.
    # El `^~` es necesario: sin él, un .svg ahí dentro lo atraparía el bloque
    # de imágenes de abajo (las location con regex ganan a las de prefijo) y
    # se quedaría con la caché corta en vez de la de 1 año.
    location ^~ /_next/static/ {
        # sin `expires`: esa directiva emite su propio Cache-Control y acababan
        # saliendo dos cabeceras que el navegador junta en una sola línea
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- imágenes y fuentes de public/ ----------
    # Estas NO llevan hash (/img/Logo.svg sigue llamándose igual tras un
    # deploy), así que caché corta y a revalidar.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------- el HTML nunca se cachea ----------
    # Es lo que apunta a los assets con hash: si el navegador se lo queda,
    # el deploy no se ve hasta que caduque. Este bloque también aplica al
    # fallback de abajo, porque `try_files` hace una redirección interna y
    # nginx vuelve a evaluar los `location`.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------- ping para el healthcheck ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- 404 ----------
    # El export genera su propia página de error; sin esto nginx serviría la
    # suya, que no comparte ni tipografía ni colores con el sitio.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- rutas ----------
    # Con `trailingSlash: true` cada ruta se exporta como `ruta/index.html`,
    # así que `$uri/` la encuentra como fichero real. Ya NO hay fallback a
    # /index.html: eso era necesario cuando el router vivía en el cliente y
    # cualquier ruta tenía que devolver la misma página. Ahora una URL que no
    # existe debe dar 404 de verdad — si no, Google indexaría la home
    # duplicada bajo cada dirección inventada.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

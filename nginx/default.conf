# Nginx para una SPA de Vite servida en la raíz del dominio.
#
# OJO con `add_header`: NO se hereda. En cuanto un `location` declara su
# propio `add_header`, pierde TODOS los del bloque `server`. Por eso las
# cabeceras de seguridad se repiten en cada location que añade las suyas.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- cabeceras de seguridad ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No hay Content-Security-Policy a propósito: index.html carga Google
    # Fonts y el kit de Font Awesome desde CDN, así que una CSP estricta
    # rompería la tipografía y los iconos. Si algún día quitas esos CDN,
    # este es el sitio donde añadirla.

    # ---------- assets con hash en el nombre ----------
    # index-bI6x1aM6.js y compañía: el nombre cambia en cada build, así que
    # se pueden cachear para siempre sin miedo a servir una versión vieja.
    # El `^~` es necesario: sin él, un .svg dentro de /assets/ lo atraparía el
    # bloque de imágenes de abajo (las location con regex ganan a las de
    # prefijo) y se quedaría con la caché corta en vez de la de 1 año.
    location ^~ /assets/ {
        # sin `expires`: esa directiva emite su propio Cache-Control y acababan
        # saliendo dos cabeceras que el navegador junta en una sola línea
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- imágenes y fuentes de public/ ----------
    # Estas NO llevan hash (/img/Logo.svg sigue llamándose igual tras un
    # deploy), así que caché corta y a revalidar.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------- el HTML nunca se cachea ----------
    # Es lo que apunta a los assets con hash: si el navegador se lo queda,
    # el deploy no se ve hasta que caduque. Este bloque también aplica al
    # fallback de abajo, porque `try_files` hace una redirección interna y
    # nginx vuelve a evaluar los `location`.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------- ping para el healthcheck ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- fallback de la SPA ----------
    # App.tsx usa BrowserRouter: /projects es una ruta de React, no un archivo.
    # Sin esto, recargar en cualquier ruta que no sea "/" daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

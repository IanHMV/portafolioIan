# Levantar en local:      docker compose up --build
# Levantar en el server:  docker compose up -d --build
services:
  web:
    build:
      context: .
    image: portafolio-ian:latest
    container_name: portafolio-ian
    restart: unless-stopped
    ports:
      # El "127.0.0.1:" del principio es deliberado: publica el puerto SOLO
      # en loopback, que es donde lo busca el nginx del host (proxy_pass a
      # http://127.0.0.1:8080). Sin esa IP, Docker abre el 8080 a internet
      # escribiendo en iptables por debajo de ufw: el firewall no lo tapa y
      # cualquiera puede saltarse Cloudflare y el TLS.
      #
      # Solo si NO hay proxy inverso delante y esta es la página principal:
      # cambia el mapeo a "80:80" (y ya te toca resolver el TLS aquí dentro).
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
